<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgSealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sealRingGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sealRingGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="sealBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgSealBlue)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Cryptographic Orbital Ring -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#sealRingGradA)" stroke-width="10" stroke-linecap="round" stroke-dasharray="380 40" filter="url(#sealBlueGlow)"/>

  <!-- Inner Interlocking Verification Ring -->
  <circle cx="128" cy="128" r="54" fill="none" stroke="url(#sealRingGradB)" stroke-width="5" stroke-dasharray="12 8" opacity="0.85"/>

  <!-- Center Digital Certificate Stamp Core -->
  <circle cx="128" cy="128" r="38" fill="#2563EB"/>
  <circle cx="128" cy="128" r="32" fill="#0F172A"/>

  <!-- Central TLS Lock & Flow Vector (Crisp White & Cyan) -->
  <path d="M 122,118 C 122,114 125,111 128,111 C 131,111 134,114 134,118 L 134,124 L 122,124 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="117" y="124" width="22" height="17" rx="4" fill="#FFFFFF"/>
  <circle cx="128" cy="131" r="2.5" fill="#0284C7"/>
  <path d="M 128,133.5 L 128,137.5" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>

  <!-- Orbital Trust Verification Nodes -->
  <circle cx="128" cy="54" r="6" fill="#22D3EE"/>
  <circle cx="128" cy="54" r="2.5" fill="#FFFFFF"/>
  <circle cx="128" cy="202" r="6" fill="#38BDF8"/>
  <circle cx="128" cy="202" r="2.5" fill="#FFFFFF"/>
</svg>
