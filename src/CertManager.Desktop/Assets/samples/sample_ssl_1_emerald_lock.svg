<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgSsl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120E"/>
      <stop offset="100%" stop-color="#0B1E17"/>
    </linearGradient>
    <linearGradient id="emeraldFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00F5A0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgSsl1)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#134E4A" stroke-width="2"/>

  <!-- Flowing Infinity Shackle (Continuous SSL Renewal) -->
  <path d="M 96,112 
           C 96,82 110,62 128,62 
           C 146,62 160,82 160,112 
           L 160,126 L 96,126 Z" 
        fill="none" stroke="url(#emeraldFlow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>

  <!-- Padlock Body with Soft Bevel -->
  <rect x="76" y="118" width="104" height="84" rx="20" fill="url(#bodyGrad)"/>
  <rect x="76" y="118" width="104" height="84" rx="20" fill="none" stroke="#6EE7B7" stroke-width="2" opacity="0.6"/>

  <!-- Verified Security Keyhole with White Ambient Center -->
  <circle cx="128" cy="150" r="10" fill="#FFFFFF"/>
  <path d="M 124,154 L 122,174 L 134,174 L 132,154 Z" fill="#FFFFFF"/>
  <circle cx="128" cy="150" r="4" fill="#047857"/>

  <!-- Secure Green Checkmark Accent Tag -->
  <circle cx="178" cy="122" r="14" fill="#00F5A0" filter="url(#emeraldGlow)"/>
  <path d="M 172,122 L 176,126 L 184,118" fill="none" stroke="#064E3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
