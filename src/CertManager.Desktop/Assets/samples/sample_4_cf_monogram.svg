<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cfGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cfGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#shieldBg4)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- 'C' Monogram Outer Enclosure (Shield/Lock boundary) -->
  <path d="M 172,82 C 158,66 142,60 120,60 C 82,60 58,88 58,128 C 58,168 82,196 120,196 C 146,196 164,188 176,172" 
        fill="none" stroke="url(#cfGradA)" stroke-width="20" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- 'F' Monogram Horizontal Crossbars Forming Secure Key Shackle -->
  <path d="M 112,94 L 178,94" 
        stroke="url(#cfGradB)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 112,130 L 160,130" 
        stroke="url(#cfGradB)" stroke-width="16" stroke-linecap="round"/>

  <!-- Secure Anchor Terminal Dot -->
  <circle cx="178" cy="94" r="5" fill="#FFFFFF"/>
  <circle cx="160" cy="130" r="5" fill="#FFFFFF"/>
</svg>
