<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgSsl3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="100%" stop-color="#071913"/>
    </linearGradient>
    <linearGradient id="ringGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ringGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00F5A0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgSsl3)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#064E3B" stroke-width="2"/>

  <!-- Outer Cryptographic Orbital Ring -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#ringGradA)" stroke-width="10" stroke-linecap="round" stroke-dasharray="380 40" filter="url(#sealGlow)"/>

  <!-- Inner Interlocking Verification Ring -->
  <circle cx="128" cy="128" r="54" fill="none" stroke="url(#ringGradB)" stroke-width="5" stroke-dasharray="12 8" opacity="0.8"/>

  <!-- Center Digital Certificate Stamp Core -->
  <circle cx="128" cy="128" r="38" fill="#10B981"/>
  <circle cx="128" cy="128" r="32" fill="#064E3B"/>

  <!-- Central TLS Lock & Flow Vector -->
  <path d="M 122,118 C 122,114 125,111 128,111 C 131,111 134,114 134,118 L 134,124 L 122,124 Z" 
        fill="none" stroke="#00F5A0" stroke-width="3" stroke-linecap="round"/>
  <rect x="118" y="124" width="20" height="16" rx="4" fill="#00F5A0"/>
  <circle cx="128" cy="130" r="2" fill="#064E3B"/>
  <path d="M 128,132 L 128,136" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>

  <!-- Orbital Trust Verification Nodes -->
  <circle cx="128" cy="54" r="6" fill="#00F5A0"/>
  <circle cx="128" cy="54" r="2.5" fill="#FFFFFF"/>
  <circle cx="128" cy="202" r="6" fill="#06B6D4"/>
  <circle cx="128" cy="202" r="2.5" fill="#FFFFFF"/>
</svg>
