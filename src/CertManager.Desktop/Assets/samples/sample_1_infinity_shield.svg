<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#shieldBg1)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Shield Perimeter Arc -->
  <path d="M 128,48 C 176,64 196,72 196,112 C 196,168 158,198 128,212 C 98,198 60,168 60,112 C 60,72 80,64 128,48 Z" 
        fill="none" stroke="#1E293B" stroke-width="14"/>

  <!-- Glowing Infinity Shield Ribbon -->
  <path d="M 128,48 C 176,64 196,72 196,112 C 196,168 158,198 128,212 C 98,198 60,168 60,112 C 60,72 80,64 128,48 Z" 
        fill="none" stroke="url(#flowGrad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1)"/>

  <!-- Central Padlock Element -->
  <path d="M 112,114 C 112,105 119,98 128,98 C 137,98 144,105 144,114 L 144,124 L 112,124 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <rect x="104" y="124" width="48" height="38" rx="8" fill="#FFFFFF"/>
  <circle cx="128" cy="140" r="4" fill="#0284C7"/>
  <path d="M 128,144 L 128,152" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
</svg>
