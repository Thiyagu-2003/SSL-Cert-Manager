<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgSsl2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020807"/>
      <stop offset="100%" stop-color="#091B15"/>
    </linearGradient>
    <linearGradient id="shieldGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mintStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgSsl2)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#064E3B" stroke-width="2"/>

  <!-- Outer Protective Shield -->
  <path d="M 128,42 
           C 180,62 202,70 202,112 
           C 202,168 164,204 128,222 
           C 92,204 54,168 54,112 
           C 54,70 76,62 128,42 Z" 
        fill="url(#shieldGradGreen)" filter="url(#shieldGlow)"/>

  <!-- Inner Dynamic Flow Ribbons -->
  <path d="M 128,54 
           C 172,72 190,78 190,114 
           C 190,160 156,192 128,208" 
        fill="none" stroke="url(#mintStreak)" stroke-width="6" opacity="0.8" stroke-linecap="round"/>

  <!-- Central Floating Verified Padlock Glyph -->
  <path d="M 114,116 C 114,106 120,98 128,98 C 136,98 142,106 142,116 L 142,126 L 114,126 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <rect x="106" y="126" width="44" height="34" rx="8" fill="#FFFFFF"/>

  <!-- Keyhole in Padlock -->
  <circle cx="128" cy="140" r="3.5" fill="#047857"/>
  <path d="M 128,143 L 128,150" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Prominent Verified Security Star / Check Accent -->
  <path d="M 104,180 L 122,196 L 156,166" fill="none" stroke="#00F5A0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
