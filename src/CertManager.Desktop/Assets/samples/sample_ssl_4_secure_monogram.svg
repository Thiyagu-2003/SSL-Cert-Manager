<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgSsl4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020807"/>
      <stop offset="100%" stop-color="#071912"/>
    </linearGradient>
    <linearGradient id="monoGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="monoGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00F5A0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgSsl4)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#064E3B" stroke-width="2"/>

  <!-- 'C' Outer Enclosure Forming SSL Perimeter -->
  <path d="M 174,80 C 160,64 142,58 120,58 C 80,58 56,88 56,128 C 56,168 80,198 120,198 C 146,198 166,190 178,174" 
        fill="none" stroke="url(#monoGradA)" stroke-width="20" stroke-linecap="round" filter="url(#softGlowGreen)"/>

  <!-- 'F' Horizontal Bars (SSL Key Shackle) -->
  <path d="M 112,94 L 180,94" 
        stroke="url(#monoGradB)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 112,130 L 162,130" 
        stroke="url(#monoGradB)" stroke-width="16" stroke-linecap="round"/>

  <!-- Glowing Terminal Anchors -->
  <circle cx="180" cy="94" r="5" fill="#FFFFFF"/>
  <circle cx="162" cy="130" r="5" fill="#FFFFFF"/>
  <circle cx="120" cy="128" r="4" fill="#00F5A0"/>
</svg>
